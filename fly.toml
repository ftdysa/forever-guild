# fly.toml app configuration file for the old-school Fly app
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Single machine only: the roster is a SQLite file on one volume.
# Secrets (not in this file): fly secrets set GUILD_PASSPHRASE=... SESSION_SECRET=...
#   BLIZZARD_CLIENT_ID=... BLIZZARD_CLIENT_SECRET=... DISCORD_WEBHOOK_URL=...

app = 'old-school'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  DB_PATH = '/data/roster.db'
  COOKIE_SECURE = 'true'
  TRUST_PROXY = 'true'
  # Fly's proxy sets this to the real client address; rate limiting keys on it.
  CLIENT_IP_HEADER = 'fly-client-ip'
  # Armory guild. Forever has no realms, so BLIZZARD_REALM stays unset.
  # Switching guilds: change these, then wipe with reset-data (see README).
  BLIZZARD_REGION = 'us'
  BLIZZARD_NAMESPACE = 'forever'
  BLIZZARD_GUILD = 'old-school'
  # Names for guild ranks 0,1,2…; Blizzard's API only gives numbers. Unnamed ranks show as "Rank N".
  # GUILD_RANKS = 'Guild Master,Officer,Veteran,Member,Alt,Initiate'
  SITE_URL = 'https://old-school.fly.dev'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: the background guild sync (every 5 minutes) only runs while the machine does.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/api/game-data'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
